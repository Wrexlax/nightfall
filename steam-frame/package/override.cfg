; Nightfall for Steam Frame: project settings applied on top of the built-in
; ones at start. Godot reads this file from beside the program.
;
; A settings folder of this port's own: ~/.local/share/NightfallFrame.
; Without this, Godot uses ~/.local/share/godot/app_userdata/Nightfall, which
; the original Nightfall's Steam Frame build uses as well (both projects are
; named Nightfall): on 2026-11-18 each started with what the other had left
; there. nightfall.sh carries this port's earlier settings over once.

[application]

config/use_custom_user_dir=true
config/custom_user_dir_name="NightfallFrame"

; Foveated rendering with "subsampled images" comes out warped on the Frame:
; SteamVR can't show such pictures yet (Godot pull request 124811). Off here;
; the Foveation option in Advanced Settings does the rest.

[xr]

openxr/foveation_with_subsampled_images=false
